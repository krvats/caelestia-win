name: Bug report
description: Something does not install or does not work
labels: [bug]
body:
  - type: textarea
    id: doctor
    attributes:
      label: Output of `cw doctor`
      render: text
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2 (build 22631)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `komorebic --version`, `yasbc --version` and `winget --version`
      render: text
